  '/v1/stores/{storeId}/dashboard/search':
    get:
      tags:
        - dashboard
      summary: Search dashboard
      description: "Performs a fast search across all searchable dashboard resources.\n            \nThis endpoint should always be preferred when searching for anything within a store. It is backed by a dedicated search index and is significantly faster than the\nper-resource search filters, such as the search parameter on GET /v1/stores/{storeId}/customers\n            \nResults can be narrowed to a single resource with search_result_type, or refined with search_hints\nCall the search hints endpoint to discover the supported hint prefixes"
      operationId: Dashboard_SearchDashboard
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to search within.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: query
          in: query
          schema:
            type: string
        - name: search_hints
          in: query
          style: deepObject
          schema:
            type: object
            additionalProperties:
              type: string
        - name: search_result_type
          in: query
          schema:
            $ref: '#/components/schemas/DashboardSearchResultTypeDto'
        - name: limit
          in: query
          description: The maximum number of items to return in a single request.
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
        - name: after
          in: query
          description: "Returns items after the specified ID.\nUsed for forward pagination through results."
          schema:
            $ref: '#/components/schemas/FlakeId'
          example: 'null'
        - name: before
          in: query
          description: "Returns items before the specified ID.\nUsed for backward pagination through results."
          schema:
            $ref: '#/components/schemas/FlakeId'
          example: 'null'
        - name: asc
          in: query
          description: "Determines the sort order of returned items.\nWhen true, items are returned in ascending order.\nWhen false, items are returned in descending order."
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDashboardResponseDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
      x-paynow-mcp:
        name: paynow_search_dashboard
        description: 'Searches the whole store at once (customers, orders, products, coupons, sales, gift cards, tags, affiliate links, trials, subscriptions, bans, game servers, API keys, tier groups, custom variables, global commands, webhooks, email templates, email deliveries). Prefer this for finding an ID by name, email, code or identity. Use paynow_list_dashboard_search_hints for the supported qualifiers.'
        readOnly: true
        standalone: true
  '/v1/stores/{storeId}/dashboard/search-hints':
