      x-gitbook-ignore: true
      x-paynow-mcp:
        name: paynow_search_docs
        description: 'Searches the PayNow developer documentation at docs.paynow.gg: API reference endpoints and models, the TypeScript SDK, PayNow.js (the embedded checkout overlay), webhooks, hosted webstore templates, and the Self-Hosted Webstores guides for building a custom or headless store. Use it for anything involving code or HTTP: signing customers in (Steam, Minecraft, customer tokens), carts, checkout sessions, gifting, subscriptions, account pages, pricing and tax fields, which credential an endpoint needs, and API error messages. Call it before writing client code, not only when stuck. Keyword-style queries work best, such as ''steam login customer token'', ''gift_to cart line'' or ''paynow.js completed event''. Returns the best matching sections, each with a direct link and a snippet; open the link when you need the full request or response shape. Use paynow_search_guides for dashboard and store-owner questions instead.'
