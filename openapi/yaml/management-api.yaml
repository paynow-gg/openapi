      summary: Get dashboard search hints
      description: "Retrieves the search hints supported by dashboard search. Each hint describes a prefix (for example a field qualifier), an example usage, and what it filters on.\n            \nUse this endpoint to discover which hints are available before building a query for the dashboard search endpoint, which is the preferred way of searching a store\nbecause it is far faster than the per-resource search filters, such as the search parameter on GET /v1/stores/{storeId}/customers"
