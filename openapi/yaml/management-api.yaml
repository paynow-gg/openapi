openapi: '3.1.1'
info:
  title: PayNow Management API
  description: 'The Management API provides tools for store administration, accessible by a store API key. It enables operations such as updating product prices, creating promotional coupons, managing customer inventories, and other backend store management functions.This API must be called from a secure server and requires proper authentication.'
  termsOfService: https://paynow.gg/terms-of-use
  contact:
    name: 'PayNow Services, Inc.'
    url: https://paynow.gg
    email: support@paynow.gg
  version: v1
paths:
  '/v1/stores/{storeId}/affiliate-links':
    get:
      tags:
        - affiliate-links
      summary: Get affiliate links
      description: Retrieves all affiliate links for the specified store.
      operationId: AffiliateLinks_GetAffiliateLinks
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to retrieve affiliate links for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AffiliateLinkDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_list_affiliate_links
        description: Lists every affiliate link. Not paginated. Use it to find a link's ID.
        readOnly: true
    post:
      tags:
        - affiliate-links
      summary: Create affiliate link
      description: Creates a new affiliate link in the specified store.
      operationId: AffiliateLinks_CreateAffiliateLink
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to create the affiliate link in.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      requestBody:
        description: The affiliate link to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAffiliateLinkDto'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateAffiliateLinkDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateAffiliateLinkDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateLinkDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_create_affiliate_link
        description: 'Creates an affiliate (referral) link. Reminder: percentages are tenths of a percent (125 = 12.5%), fixed amounts are in the smallest currency unit, and a fixed ''commission_type'' is not supported yet.'
        readOnly: false
  '/v1/stores/{storeId}/affiliate-links/{affiliateLinkId}':
    get:
      tags:
        - affiliate-links
      summary: Get affiliate link by ID
      description: Retrieves an affiliate link by the ID for the specified store.
      operationId: AffiliateLinks_GetAffiliateLink
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to retrieve the affiliate link for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: affiliateLinkId
          in: path
          description: The ID of the affiliate link.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateLinkDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_get_affiliate_link
        description: 'Returns one affiliate link by ID. Lookup is by ID, not by code.'
        readOnly: true
    patch:
      tags:
        - affiliate-links
      summary: Update affiliate link by ID
      description: Performs a delta update of an affiliate link by the ID for the specified store.
      operationId: AffiliateLinks_UpdateAffiliateLink
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to update the affiliate link for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: affiliateLinkId
          in: path
          description: The ID of the affiliate link.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      requestBody:
        description: The affiliate link fields to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAffiliateLinkDto'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateAffiliateLinkDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateAffiliateLinkDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateLinkDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_update_affiliate_link
        description: Partial update. Send only the fields to change. Changing 'code' changes the live referral URL. Same units as create.
        readOnly: false
    delete:
      tags:
        - affiliate-links
      summary: Delete affiliate link by ID
      description: Deletes an affiliate link by the ID for the specified store.
      operationId: AffiliateLinks_DeleteAffiliateLink
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to delete the affiliate link for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: affiliateLinkId
          in: path
          description: The ID of the affiliate link.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      responses:
        '204':
          description: No Content
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_delete_affiliate_link
        description: 'Permanently deletes an affiliate link. To pause one instead, set ''enabled'' to false.'
        readOnly: false
  '/v1/stores/{storeId}/bans':
    get:
      tags:
        - bans
      summary: Get bans
      description: Retrieves all bans for the specified store.
      operationId: Bans_GetBans
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to retrieve bans for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: ban_type
          in: query
          schema:
            $ref: '#/components/schemas/BanType'
        - name: ban_type_value
          in: query
          schema:
            type: string
        - name: reason
          in: query
          schema:
            type: string
        - name: limit
          in: query
          description: The maximum number of items to return in a single request.
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
        - name: after
          in: query
          description: "Returns items after the specified ID.\nUsed for forward pagination through results."
          schema:
            $ref: '#/components/schemas/FlakeId'
          example: 'null'
        - name: before
          in: query
          description: "Returns items before the specified ID.\nUsed for backward pagination through results."
          schema:
            $ref: '#/components/schemas/FlakeId'
          example: 'null'
        - name: asc
          in: query
          description: "Determines the sort order of returned items.\nWhen true, items are returned in ascending order.\nWhen false, items are returned in descending order."
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BanDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_list_bans
        description: 'Lists bans, newest first, with optional filters and cursor paging. To check a specific identity, use paynow_check_ban instead.'
        readOnly: true
    post:
      tags:
        - bans
      summary: Create ban
      description: Creates a new ban in the specified store.
      operationId: Bans_CreateBan
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to create the ban in.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      requestBody:
        description: The ban to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBanRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/UpsertBanRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpsertBanRequestDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_create_ban
        description: 'Bans one or more identities (Steam ID, IP, customer, customer name or email). If you dont provide an expiry the ban is permanent.'
        readOnly: false
  '/v1/stores/{storeId}/bans/{banId}':
    get:
      tags:
        - bans
      summary: Get ban by ID
      description: Retrieves a ban by the ID for the specified store.
      operationId: Bans_GetBan
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to retrieve the ban for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: banId
          in: path
          description: The ID of the ban.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_get_ban
        description: 'Returns one ban by ID, including every identity it covers.'
        readOnly: true
    patch:
      tags:
        - bans
      summary: Update ban by ID
      description: Updates a ban by the ID for the specified store.
      operationId: Bans_UpdateBan
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to update the ban for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: banId
          in: path
          description: The ID of the ban.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      requestBody:
        description: The ban details to store.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBanRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/UpsertBanRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpsertBanRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_update_ban
        description: 'Full replace, not a partial update. omitted identities are dropped. Read the ban first and send back the complete list.'
        readOnly: false
    delete:
      tags:
        - bans
      summary: Delete ban by ID
      description: Deletes a ban by the ID for the specified store.
      operationId: Bans_DeleteBan
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to delete the ban for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: banId
          in: path
          description: The ID of the ban.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      responses:
        '204':
          description: No Content
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_delete_ban
        description: Removes a ban and unbans every identity it covers. Cannot be undone.
        readOnly: false
  '/v1/stores/{storeId}/bans/check':
    post:
      tags:
        - bans
      summary: Check for ban by identities
      description: Checks whether any of the supplied identities are banned in the specified store.
      operationId: Bans_CheckForBanByIdentities
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to check the identities for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      requestBody:
        description: The identities to check.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckForBanIDByIdentitiesRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/CheckForBanIDByIdentitiesRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CheckForBanIDByIdentitiesRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckForBanIDByIdentitiesResponseDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-mcp:
        name: paynow_check_ban
        description: Checks whether any of the given identities is banned and returns the matching ban ID. Read-only despite being a POST.
        readOnly: true
  '/v1/stores/{storeId}/billing/plans':
    get:
      tags:
        - billing
      summary: Get available plans
      description: Retrieves the plans a store can subscribe to.
      operationId: StoreBilling_GetPublicPlans
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanPreviewDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
  '/v1/stores/{storeId}/billing/plans/change':
    post:
      tags:
        - billing
      summary: Change subscription plan
      description: "Moves the store onto a different plan. When the change needs paying for, the response\ncarries a 'session_url' the store owner must complete."
      operationId: StoreBilling_ChangeSubscriptionPlan
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to change the plan for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      requestBody:
        description: The plan to move onto and how often it should renew.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSubscriptionPlanDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ChangeSubscriptionPlanDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ChangeSubscriptionPlanDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
  '/v1/stores/{storeId}/billing/plans/continue':
    post:
      tags:
        - billing
      summary: Continue current subscription
      description: 'Cancels a pending downgrade or cancellation, keeping the store on its current plan.'
      operationId: StoreBilling_ContinueCurrentSubscription
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to keep on its current plan.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      responses:
        '204':
          description: No Content
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
  '/v1/stores/{storeId}/billing/payment-method/change':
    post:
      tags:
        - billing
      summary: Create payment method update session
      description: "Returns a customer portal session scoped to updating the payment method of the store's\nactive subscription. The store owner has to visit the returned 'session_url' to complete\nthe update."
      operationId: StoreBilling_CreatePaymentMethodUpdateSession
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to change the payment method for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodUpdateSessionDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
  '/v1/stores/{storeId}/billing/orders':
    get:
      tags:
        - billing
      summary: Get billing orders
      description: "Retrieves the orders placed for the store's own subscription. Only the store owner may\ncall this."
      operationId: StoreBilling_GetStoreBillingOrders
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to retrieve billing orders for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: limit
          in: query
          description: The maximum number of items to return in a single request.
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
        - name: after
          in: query
          description: "Returns items after the specified ID.\nUsed for forward pagination through results."
          schema:
            $ref: '#/components/schemas/FlakeId'
          example: 'null'
        - name: before
          in: query
          description: "Returns items before the specified ID.\nUsed for backward pagination through results."
          schema:
            $ref: '#/components/schemas/FlakeId'
          example: 'null'
        - name: asc
          in: query
          description: "Determines the sort order of returned items.\nWhen true, items are returned in ascending order.\nWhen false, items are returned in descending order."
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorefrontOrderDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
  '/v1/stores/{storeId}/billing/orders/{orderId}/invoice':
    get:
      tags:
        - billing
      summary: Get billing order invoice
      description: "Generates the invoice for one of the store's billing orders, if it does not exist yet, and returns a\ntemporary URL to download it. Only the store owner may call this."
      operationId: StoreBilling_GetStoreBillingOrderInvoice
      parameters:
        - name: storeId
          in: path
          description: The ID of the store the billing order belongs to.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: orderId
          in: path
          description: The ID of the billing order to retrieve the invoice for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDownloadUrlResponseDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
  '/v1/stores/{storeId}/billing/invoices/stripe':
    get:
      tags:
        - billing
      summary: Get Stripe invoices
      description: "Retrieves the invoices Stripe Billing raised for the store's subscription before the store moved to\nPayNow, newest first. Only the store owner may call this."
      operationId: StoreBilling_GetStripeStoreInvoices
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to retrieve Stripe invoices for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: limit
          in: query
          description: 'The maximum number of invoices to return, between 1 and 100. Defaults to 25.'
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
        - name: starting_after
          in: query
          description: The 'id' of the last invoice of the previous page.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeStoreInvoicesDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
  '/v1/stores/{storeId}/billing/invoices/stripe/{invoiceId}':
    get:
      tags:
        - billing
      summary: Get Stripe invoice
      description: "Returns a URL to download one of the store's Stripe Billing invoices. Only the store owner may\ncall this."
      operationId: StoreBilling_GetStripeStoreInvoice
      parameters:
        - name: storeId
          in: path
          description: The ID of the store the invoice belongs to.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
        - name: invoiceId
          in: path
          description: 'The Stripe identifier of the invoice, starting with ''in_''.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDownloadUrlResponseDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
  '/v1/stores/{storeId}/billing/details':
    get:
      tags:
        - billing
      summary: Get billing details
      description: Retrieves the billing address and tax details the store is invoiced under.
      operationId: StoreBilling_GetStoreBillingDetails
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to retrieve billing details for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreBillingDetailsDto'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
      x-paynow-docs-ignore: true
      x-gitbook-ignore: true
    put:
      tags:
        - billing
      summary: Update billing details
      description: Replaces the billing address and tax details the store is invoiced under.
      operationId: StoreBilling_UpdateStoreBillingDetails
      parameters:
        - name: storeId
          in: path
          description: The ID of the store to update billing details for.
          required: true
          schema:
            $ref: '#/components/schemas/FlakeId'
      requestBody:
        description: The billing address and tax details to store.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBillingDetailsDto'
          text/json:
            schema:
              $ref: '#/components/schemas/StoreBillingDetailsDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/StoreBillingDetailsDto'
      responses:
        '204':
          description: No Content
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayNowError'
      security:
        - APIKey: [ ]
